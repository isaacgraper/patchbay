services:
  patchbay-backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "4333:4333"
    volumes:
      - ./user_skills:/app/user_skills
      # The container runs as a non-root user (uid 10001). If patchbay.db
      # doesn't exist yet, create it and chown it before first run:
      #   touch patchbay.db && sudo chown 10001:10001 patchbay.db
      - ./patchbay.db:/app/patchbay.db
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
