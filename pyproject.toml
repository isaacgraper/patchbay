[tool.poetry]
name = "patchbay"
version = "0.1.0"
description = "Visual Runtime Router for MCP servers and agentic pipelines"
authors = ["Isaac Graper"]
license = "MIT"
readme = "README.md"
packages = [{include = "backend", from = "packages/backend/src"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
aiosqlite = "^0.20.0"
alembic = "^1.14.0"
fastmcp = "^0.4.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
mypy = "^1.13.0"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pre-commit = "^4.6.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
allow_untyped_decorators = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/backend/tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
